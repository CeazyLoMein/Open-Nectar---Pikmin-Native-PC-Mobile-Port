name: Experimental native iOS game build (unsigned)

# A workflow_dispatch workflow must exist on the default branch to be run manually
# in GitHub's UI. This candidate is intentionally on ios-experimental instead.
# To enable controlled runs without changing main, use the commit marker [ios-build].
# Add [ios-p2-only] for P2 only; [ios-p1-update] builds only P1's test update.
# [ios-p1-only] builds P1 standard campaign only.
# [ios-p1-test] selects the separate P1 test app. Other marked pushes build both.
on:
  push:
    branches:
      - ios-experimental
  workflow_dispatch:

jobs:
  scene-startup:
    # Gate both games on a real UIKit launch, not just successful compilation.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios-build]') }}
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check shared scene startup contract and diagnostic runner
        run: |
          python3 tests/ios_scene_contract_test.py
          python3 tests/ios_scene_runner_test.py
      - name: Build asset-free simulator startup probe
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          cmake -S tests/ios_scene_smoke -B "$RUNNER_TEMP/nectar-scene-build" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          cmake --build "$RUNNER_TEMP/nectar-scene-build" --config Release --target NectarSceneSmoke --parallel 3 \
            2>&1 | tee ios-scene-build.log
      - name: Launch and test scene-owned window and background resume
        run: python3 tests/run_ios_scene_smoke.py --build-root "$RUNNER_TEMP/nectar-scene-build" --output scene-startup-results
      - name: Preserve startup probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-scene-startup-check
          path: |
            ios-scene-build.log
            scene-startup-results/
          if-no-files-found: warn
  build:
    needs: scene-startup
    # Run both games on marked pushes; manual trigger works if workflow is on the default branch.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios-build]') }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ${{ (contains(github.event.head_commit.message, '[ios-p1-update]') || contains(github.event.head_commit.message, '[ios-p1-only]')) && fromJSON('["pikmin1"]') || contains(github.event.head_commit.message, '[ios-p2-only]') && fromJSON('["pikmin2"]') || fromJSON('["pikmin1","pikmin2"]') }}
    # iOS 27.1 SDK opts into the Duo full display; the minimum OS stays 15.
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GAME: ${{ matrix.game }}
      IOS_VARIANT: ${{ matrix.game == 'pikmin1' && (contains(github.event.head_commit.message, '[ios-p1-update]') && 'solo-update' || contains(github.event.head_commit.message, '[ios-p1-test]') && 'solo-test') || 'standard' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 -c 'import subprocess; v=subprocess.check_output(["xcrun","--sdk","iphoneos","--show-sdk-version"],text=True).strip(); assert tuple(map(int,v.split("."))) >= (27,1), "Full-display build requires iOS SDK 27.1+"'
          cmake --version
      - name: Check adaptive landscape layout and player FPS choices
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ios_display_layout_test.py "$RUNNER_TEMP/ios-display-test.cpp"
          c++ -std=c++14 -Wall -Wextra -Werror "$RUNNER_TEMP/ios-display-test.cpp" -o "$RUNNER_TEMP/ios-display-test"
          "$RUNNER_TEMP/ios-display-test"
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++14 -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/ios-display-test.cpp"
      - name: Check P1 iOS keyboard ownership and desktop preservation
        if: matrix.game == 'pikmin1'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/pikmin1_ios_keyboard_test.py "$RUNNER_TEMP/p1-keyboard.cpp"
          c++ -std=c++14 -Wall -Wextra -Werror "$RUNNER_TEMP/p1-keyboard.cpp" -o "$RUNNER_TEMP/p1-keyboard"
          "$RUNNER_TEMP/p1-keyboard"
          c++ -std=c++14 -Wall -Wextra -Werror -DTEST_DESKTOP "$RUNNER_TEMP/p1-keyboard.cpp" -o "$RUNNER_TEMP/p1-keyboard-desktop"
          "$RUNNER_TEMP/p1-keyboard-desktop"
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++14 -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/p1-keyboard.cpp"
      - name: Check actual native pixel resolution and legacy portrait settings
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ios_pixel_resolution_test.py "$RUNNER_TEMP/ios-pixel-test.cpp"
          c++ -std=c++14 -Wall -Wextra -Werror "$RUNNER_TEMP/ios-pixel-test.cpp" -o "$RUNNER_TEMP/ios-pixel-test"
          "$RUNNER_TEMP/ios-pixel-test"
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++14 -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/ios-pixel-test.cpp"
      - name: Check iOS icon resource target scope
        run: python3 tests/ios_icon_resources_test.py
      - name: Check Pikmin 2 adapter include paths
        if: matrix.game == 'pikmin2'
        run: python3 tests/pikmin2_adapter_includes.py
      - name: Check Pikmin 2 Apple standard-library compatibility
        if: matrix.game == 'pikmin2'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -I"$GITHUB_WORKSPACE/games/pikmin2/pikmin2-decomp-adapter" \
            "$GITHUB_WORKSPACE/tests/pikmin2_apple_nullptr_test.cpp" -o "$RUNNER_TEMP/p2-nullptr-test"
          "$RUNNER_TEMP/p2-nullptr-test"
          python3 tests/pikmin2_jstage_name_test.py "$RUNNER_TEMP/p2-jstage-test.cpp"
          c++ -std=c++14 -Wall -Wextra -Werror "$RUNNER_TEMP/p2-jstage-test.cpp" -o "$RUNNER_TEMP/p2-jstage-test"
          "$RUNNER_TEMP/p2-jstage-test"
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++14 -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/p2-jstage-test.cpp"
          python3 tests/pikmin2_container_handles_test.py "$RUNNER_TEMP/p2-container-test.cpp"
          c++ -std=c++17 "$RUNNER_TEMP/p2-container-test.cpp" -o "$RUNNER_TEMP/p2-container-test"
          "$RUNNER_TEMP/p2-container-test"
          python3 tests/pikmin2_native_addresses_test.py "$RUNNER_TEMP/p2-address-test.cpp"
          c++ -std=c++17 "$RUNNER_TEMP/p2-address-test.cpp" -o "$RUNNER_TEMP/p2-address-test"
          "$RUNNER_TEMP/p2-address-test"
          python3 tests/pikmin2_native_allocator_test.py "$RUNNER_TEMP/p2-allocator-test.cpp"
          c++ -std=c++14 -Wall -Wextra -Werror -pthread "$RUNNER_TEMP/p2-allocator-test.cpp" -o "$RUNNER_TEMP/p2-allocator-test"
          "$RUNNER_TEMP/p2-allocator-test"
          c++ -std=c++14 -Wall -Wextra -Werror -pthread -DP2_TEST_CONSOLE "$RUNNER_TEMP/p2-allocator-test.cpp" -o "$RUNNER_TEMP/p2-console-allocator-test"
          "$RUNNER_TEMP/p2-console-allocator-test"
          c++ -std=c++14 -Wall -Wextra -Werror -pthread -DP2_TEST_APPLE_SCALAR_ALIGNMENT "$RUNNER_TEMP/p2-allocator-test.cpp" -o "$RUNNER_TEMP/p2-apple-scalar-test"
          "$RUNNER_TEMP/p2-apple-scalar-test"
          # Intel host tests cannot detect Apple ARM64's 8-byte max_align_t.
          # Compile the actual allocator fixture for the real iPhone ABI too.
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++14 \
            -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/p2-allocator-test.cpp"
          python3 tests/pikmin2_gd_tls_test.py "$RUNNER_TEMP/p2-gd-tls"
          cc -std=c11 -Wall -Wextra -Werror -c "$RUNNER_TEMP/p2-gd-tls/gd-storage.c" -o "$RUNNER_TEMP/p2-gd-tls/gd-storage.o"
          c++ -std=c++17 -Wall -Wextra -pthread "$RUNNER_TEMP/p2-gd-tls/gd-main.cpp" "$RUNNER_TEMP/p2-gd-tls/gd-mirror.cpp" "$RUNNER_TEMP/p2-gd-tls/gd-storage.o" -o "$RUNNER_TEMP/p2-gd-tls/gd-tls-test"
          "$RUNNER_TEMP/p2-gd-tls/gd-tls-test"
      - name: Check Pikmin 2 native menu rendering and touch ownership
        if: matrix.game == 'pikmin2'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/pikmin2_ios_menus_test.py "$RUNNER_TEMP/p2-menu-test.cpp"
          c++ -std=c++14 -Wall -Wextra -Werror "$RUNNER_TEMP/p2-menu-test.cpp" -o "$RUNNER_TEMP/p2-menu-test"
          "$RUNNER_TEMP/p2-menu-test"
          c++ -std=c++14 -Wall -Wextra -Werror -DP2_TEST_DESKTOP "$RUNNER_TEMP/p2-menu-test.cpp" -o "$RUNNER_TEMP/p2-desktop-menu-test"
          "$RUNNER_TEMP/p2-desktop-menu-test"
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++14 \
            -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/p2-menu-test.cpp"
      - name: Check Pikmin 2 enhancement profile, HUD and texture imports
        if: matrix.game == 'pikmin2'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          python3 tests/pikmin2_ios_enhancements_test.py "$RUNNER_TEMP/p2-enhancements"
          mkdir -p "$RUNNER_TEMP/p2-enhancement-checks"
          cd "$RUNNER_TEMP/p2-enhancement-checks"
          c++ -std=c++17 -Wall -Wextra -Werror "$RUNNER_TEMP/p2-enhancements/reset-test.cpp" -o reset-test
          ./reset-test
          c++ -std=c++17 -Wall -Wextra -Werror -I"$ROOT/ios" -I"$ROOT/games/pikmin2/pc_port" "$RUNNER_TEMP/p2-enhancements/texture-import-action-test.cpp" -o texture-action-test
          ./texture-action-test
          python3 "$ROOT/tests/pikmin2_ios_hud_test.py" "$RUNNER_TEMP/p2-enhancements/hud-test.cpp"
          c++ -std=c++17 -Wall -Wextra -Werror "$RUNNER_TEMP/p2-enhancements/hud-test.cpp" -o hud-test
          ./hud-test
          c++ -std=c++17 -Wall -Wextra -Werror -I"$ROOT/ios" "$ROOT/tests/pikmin2_ios_profile_test.cpp" -o profile-test
          ./profile-test
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -DPIKI_P2_HOST=1 -I"$ROOT/ios" -I"$ROOT/games/pikmin2/pc_port" "$ROOT/tests/pikmin2_ios_mod_bridge_test.cpp" "$ROOT/ios/pc_ios_mod_bridge.cpp" -o bridge-test
          ./bridge-test
          # These shared paths also preserve P1's picker behavior and rollback rules.
          c++ -std=c++17 -pthread -I"$ROOT/ios" "$ROOT/tests/pikmin1_ios_mod_bridge_test.cpp" "$ROOT/ios/pc_ios_mod_bridge.cpp" -o p1-bridge-test
          ./p1-bridge-test
          c++ -std=c++17 -I"$ROOT/ios" -I"$ROOT/games/pikmin1/pc_port/mods" "$ROOT/tests/pikmin1_ios_mod_transaction_test.cpp" -o transaction-test
          ./transaction-test
          c++ -std=c++17 -I"$ROOT/games/pikmin1/pc_port/mods" -I"$ROOT/games/pikmin2/third_party/stb" "$ROOT/tests/pikmin1_mod_zip_test.cpp" "$ROOT/games/pikmin1/pc_port/mods/pc_hd_model_convert.cpp" -o zip-test
          ./zip-test
          c++ -std=c++17 -I"$ROOT/games/pikmin2/pc_port" -I"$ROOT/games/pikmin1/pc_port" "$ROOT/tests/pikmin1_ios_performance_test.cpp" "$ROOT/games/pikmin1/pc_port/timing/pc_ios_performance.cpp" -o performance-test
          ./performance-test
      - name: Check Pikmin 2 audio routes and bounded diagnostics
        if: matrix.game == 'pikmin2'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          AUDIO="$ROOT/games/pikmin2/pc_port/audio"
          CHECKS="$RUNNER_TEMP/p2-audio-checks"
          python3 tests/pikmin2_audio_routes_test.py "$CHECKS"
          python3 tests/pikmin2_audio_parameters_test.py "$CHECKS/parameters-test.cpp"
          cd "$CHECKS"
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -I"$CHECKS" -I"$ROOT/games/pikmin2/pc_port" \
            test.cpp "$AUDIO/pc_dsp_host.cpp" "$AUDIO/pc_aram.cpp" "$AUDIO/pc_p2_audio_audit.cpp" -o routes-test
          ./routes-test
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -I"$CHECKS" -I"$AUDIO" \
            "$AUDIO/pc_dsp_host_test.cpp" host.cpp "$AUDIO/pc_dsp_host.cpp" "$AUDIO/pc_aram.cpp" "$AUDIO/pc_p2_audio_audit.cpp" -o baseline-test
          ./baseline-test
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -D__IPHONEOS__=1 -I"$ROOT/games/pikmin2/pc_port" \
            audit-test.cpp "$AUDIO/pc_p2_audio_audit.cpp" -o audit-test
          ./audit-test
          c++ -std=c++17 -Wall -Wextra -Werror parameters-test.cpp -o parameters-test
          ./parameters-test
          python3 "$ROOT/tests/pikmin2_demo_audio_test.py" "$CHECKS/demo-test.cpp"
          c++ -std=c++17 -Wall -Wextra -Werror demo-test.cpp -o demo-test
          ./demo-test
          # SDK platform detection must work without including SDL first.
          printf '#include "audio/pc_p2_audio_audit.h"\nstatic_assert(p2_audio_audit::kAutomaticallyEnabled, "iPhone audit must auto-enable without SDL");\n' > platform-test.cpp
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++17 -Wall -Wextra -Werror -fsyntax-only -I"$ROOT/games/pikmin2/pc_port" platform-test.cpp
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++17 -Wall -Wextra -Werror -fsyntax-only parameters-test.cpp
      - name: Check P1 upstream safety fixes and shared co-op accounting
        if: matrix.game == 'pikmin1'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/pikmin1_upstream_safety_test.py "$RUNNER_TEMP/p1-upstream-safety.cpp"
          c++ -std=c++17 -Wall -Wextra -Werror "$RUNNER_TEMP/p1-upstream-safety.cpp" -o "$RUNNER_TEMP/p1-upstream-safety"
          "$RUNNER_TEMP/p1-upstream-safety"
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++17 -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/p1-upstream-safety.cpp"
          # The offline library tests do not enable online play in the normal app.
          cmake -S libs/nectar_net -B "$RUNNER_TEMP/nectar-coop-checks" -DCMAKE_BUILD_TYPE=Release \
            -DNECTAR_NET_BUILD_TESTS=ON -DNECTAR_NET_ENABLE_GNS=OFF -DNECTAR_NET_ENABLE_UPNP=OFF
          cmake --build "$RUNNER_TEMP/nectar-coop-checks" --parallel 3
          ctest --test-dir "$RUNNER_TEMP/nectar-coop-checks" --output-on-failure --timeout 120
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++17 -Wall -Wextra -Werror -fsyntax-only -Ilibs/nectar_net/include \
            libs/nectar_net/src/onion_authority.cpp libs/nectar_net/tests/onion_authority_test.cpp \
            libs/nectar_net/src/entity_registry.cpp libs/nectar_net/tests/entity_registry_test.cpp \
            libs/nectar_net/src/pikmin_replication.cpp libs/nectar_net/tests/pikmin_replication_test.cpp \
            libs/nectar_net/src/actor_frame.cpp libs/nectar_net/tests/actor_frame_test.cpp \
            libs/nectar_net/src/coop_session.cpp libs/nectar_net/tests/coop_session_test.cpp \
            libs/nectar_net/src/coop_connection.cpp libs/nectar_net/tests/coop_connection_test.cpp \
            libs/nectar_net/src/practice_bootstrap.cpp
      - name: Check actual P1 co-op capture and pooled actor lifecycle
        if: matrix.game == 'pikmin1'
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/p1-coop-capture"
          python3 tests/pikmin1_coop_capture_test.py "$FIXTURE"
          SOURCES=("$FIXTURE/capture-test.cpp" games/pikmin1/pc_port/netplay/pc_coop_world.cpp
            libs/nectar_net/src/actor_frame.cpp libs/nectar_net/src/entity_registry.cpp libs/nectar_net/src/pikmin_replication.cpp
            libs/nectar_net/src/replication.cpp libs/nectar_net/src/world.cpp libs/nectar_net/src/byte_io.cpp)
          c++ -std=c++17 -Wall -Wextra -Werror -DPIKI_PC_PORT=1 -DNECTAR_COOP_WORLD=1 \
            -I"$FIXTURE" -Igames/pikmin1/pc_port -Ilibs/nectar_net/include "${SOURCES[@]}" -o "$FIXTURE/capture-test"
          "$FIXTURE/capture-test"
          c++ -std=c++17 -Wall -Wextra -Werror -Igames/pikmin1/pc_port "$FIXTURE/disabled-test.cpp" -o "$FIXTURE/disabled-test"
          "$FIXTURE/disabled-test"
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++17 -Wall -Wextra -Werror -DPIKI_PC_PORT=1 -DNECTAR_COOP_WORLD=1 -fsyntax-only \
            -I"$FIXTURE" -Igames/pikmin1/pc_port -Ilibs/nectar_net/include "${SOURCES[@]}"
      - name: Check actual temporary practice card and original save preservation
        if: matrix.game == 'pikmin1'
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/p1-practice-card-fixture"
          python3 tests/pikmin1_practice_card_test.py "$FIXTURE"
          SOURCES=("$FIXTURE/practice-card-test.cpp" games/pikmin1/pc_port/dolphin_stubs/card_stubs.cpp
            games/pikmin1/pc_port/pc_day_history.cpp)
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -DNECTAR_P1_SOLO_TEST=0 \
            -I"$FIXTURE" -Igames/pikmin1/pc_port "${SOURCES[@]}" -o "$FIXTURE/practice-card-test"
          RUN="$RUNNER_TEMP/p1-practice-card-run"
          mkdir -p "$RUN"
          (cd "$RUN" && "$FIXTURE/practice-card-test" "$RUN/state")
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++17 -Wall -Wextra -Werror -DNECTAR_P1_SOLO_TEST=0 -fsyntax-only \
            -I"$FIXTURE" -Igames/pikmin1/pc_port "${SOURCES[@]}"
      - name: Check protected practice startup, local views and world authority
        id: coop_practice_checks
        if: matrix.game == 'pikmin1'
        continue-on-error: true
        # Collect both fixtures and full app compiler evidence, then require
        # the original step outcome plus every check before packaging.
        run: |
          python3 tests/pikmin1_practice_checks_runner_test.py
          python3 tests/run_pikmin1_practice_checks.py --output ios-practice-check-results
      - name: Check Pikmin 1 enhancement profile and mod imports
        if: matrix.game == 'pikmin1'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          python3 tests/pikmin1_solo_app_test.py --cmake "$(command -v cmake)"
          python3 tests/pikmin1_follow_surface_test.py "$RUNNER_TEMP/p1-surface-test.cpp"
          c++ -std=c++17 -Wall -Wextra -Werror "$RUNNER_TEMP/p1-surface-test.cpp" -o "$RUNNER_TEMP/p1-surface-test"
          "$RUNNER_TEMP/p1-surface-test"
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++17 -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/p1-surface-test.cpp"
          python3 tests/pikmin1_follow_routes_test.py "$RUNNER_TEMP/p1-follow-test.cpp"
          c++ -std=c++17 -Wall -Wextra -Werror "$RUNNER_TEMP/p1-follow-test.cpp" -o "$RUNNER_TEMP/p1-follow-test"
          (cd "$RUNNER_TEMP" && ./p1-follow-test)
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++17 -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/p1-follow-test.cpp"
          python3 tests/pikmin1_walk_speed_test.py "$RUNNER_TEMP/p1-speed-test.cpp"
          c++ -std=c++17 -Wall -Wextra -Werror "$RUNNER_TEMP/p1-speed-test.cpp" -o "$RUNNER_TEMP/p1-speed-test"
          "$RUNNER_TEMP/p1-speed-test"
          c++ -std=c++17 -Wall -Wextra -Werror -DPIKI_P2_HOST=1 "$RUNNER_TEMP/p1-speed-test.cpp" -o "$RUNNER_TEMP/p2-speed-control"
          "$RUNNER_TEMP/p2-speed-control"
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++17 -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/p1-speed-test.cpp"
          python3 tests/pikmin1_command_test.py "$RUNNER_TEMP/p1-command-test.cpp"
          c++ -std=c++17 -Wall -Wextra -Werror "$RUNNER_TEMP/p1-command-test.cpp" -o "$RUNNER_TEMP/p1-command-test"
          "$RUNNER_TEMP/p1-command-test"
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++17 -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/p1-command-test.cpp"
          c++ -std=c++17 -pthread -I"$ROOT/games/pikmin1/pc_port" "$ROOT/games/pikmin1/pc_port/netplay/pc_sim_rng_test.cpp" "$ROOT/games/pikmin1/pc_port/netplay/pc_sim_rng.cpp" "$ROOT/games/pikmin1/pc_port/netplay/pc_netplay_det.cpp" -o "$RUNNER_TEMP/p1-rng-test"
          "$RUNNER_TEMP/p1-rng-test"
          python3 tests/pikmin1_solo_game_test.py "$RUNNER_TEMP/p1-solo-game-test.cpp"
          c++ -std=c++17 -Wall -Wextra -Werror -I"$ROOT/ios" "$ROOT/tests/pikmin1_solo_app_policy_test.cpp" -o "$RUNNER_TEMP/p1-solo-policy-test"
          "$RUNNER_TEMP/p1-solo-policy-test"
          c++ -std=c++17 -Wall -Wextra -Werror -DNECTAR_P1_SOLO_TEST=1 -DNECTAR_P1_SOLO_UPDATE=1 -I"$ROOT/games/pikmin1/pc_port" "$RUNNER_TEMP/p1-solo-game-test.cpp" -o "$RUNNER_TEMP/p1-solo-update-test"
          (cd "$RUNNER_TEMP" && ./p1-solo-update-test)
          c++ -std=c++17 -Wall -Wextra -Werror -DNECTAR_P1_SOLO_TEST=1 -I"$ROOT/games/pikmin1/pc_port" "$RUNNER_TEMP/p1-solo-game-test.cpp" -o "$RUNNER_TEMP/p1-solo-game-test"
          (cd "$RUNNER_TEMP" && ./p1-solo-game-test)
          c++ -std=c++17 -Wall -Wextra -Werror -I"$ROOT/games/pikmin1/pc_port" "$RUNNER_TEMP/p1-solo-game-test.cpp" -o "$RUNNER_TEMP/p1-solo-standard-test"
          (cd "$RUNNER_TEMP" && ./p1-solo-standard-test)
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++17 -Wall -Wextra -Werror -DNECTAR_P1_SOLO_TEST=1 -I"$ROOT/games/pikmin1/pc_port" -fsyntax-only "$RUNNER_TEMP/p1-solo-game-test.cpp"
          mkdir -p "$RUNNER_TEMP/nectar-ios-checks"
          cd "$RUNNER_TEMP/nectar-ios-checks"
          c++ -std=c++17 -I"$ROOT/ios" "$ROOT/tests/pikmin1_ios_profile_test.cpp" -o profile-test
          ./profile-test
          c++ -std=c++17 -pthread -I"$ROOT/ios" "$ROOT/tests/pikmin1_ios_mod_bridge_test.cpp" "$ROOT/ios/pc_ios_mod_bridge.cpp" -o bridge-test
          ./bridge-test
          c++ -std=c++17 -I"$ROOT/ios" -I"$ROOT/games/pikmin1/pc_port/mods" "$ROOT/tests/pikmin1_ios_mod_transaction_test.cpp" -o transaction-test
          ./transaction-test
          c++ -std=c++17 -I"$ROOT/games/pikmin1/pc_port/mods" -I"$ROOT/games/pikmin1/third_party/stb" "$ROOT/tests/pikmin1_mod_zip_test.cpp" "$ROOT/games/pikmin1/pc_port/mods/pc_hd_model_convert.cpp" -o zip-test
          ./zip-test
          c++ -std=c++17 -I"$ROOT/games/pikmin1/pc_port" "$ROOT/tests/pikmin1_ios_performance_test.cpp" "$ROOT/games/pikmin1/pc_port/timing/pc_ios_performance.cpp" -o performance-test
          ./performance-test
      - name: Collect native Host Join checks and generated build identity
        id: coop_room_checks
        if: matrix.game == 'pikmin1'
        # Gather independent compile failures before one final mandatory gate.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ios_room_checks_runner_test.py
          python3 tests/run_ios_room_checks.py --output ios-room-check-results
      - name: Restore pinned Apple networking dependency cache
        if: matrix.game == 'pikmin1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/open-nectar/netplay-deps
          key: ios-net-arm64-xcode27.1-v1-${{ hashFiles('scripts/netplay-deps.sh') }}
      - name: Build pinned encrypted transport for iPhone and simulator
        if: matrix.game == 'pikmin1'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/netplay-deps.sh
          python3 tests/ios_coop_socket_runner_test.py
          python3 tests/ios_coop_owned_runner_test.py
          python3 tests/ios_coop_app_executor_test.py
          bash scripts/netplay-deps.sh ios-arm64
          bash scripts/netplay-deps.sh ios-simulator-arm64
      - name: Build real encrypted iOS co-op socket session probe
        id: coop_socket_build
        if: matrix.game == 'pikmin1'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$HOME/.cache/open-nectar/netplay-deps/install/ios-simulator-arm64"
          cmake -S tests/ios_coop_app_probe -B "$RUNNER_TEMP/nectar-coop-socket" -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_FIND_ROOT_PATH="$PREFIX"
          cmake --build "$RUNNER_TEMP/nectar-coop-socket" \
            --target NectarCoopSocketProbe NectarCoopHealthProbe --parallel 3 \
            2>&1 | tee ios-coop-socket-build.log
      - name: Run real encrypted iOS co-op socket session probe
        id: coop_socket_run
        # Execute before the heavy device compile, on a fresh owned simulator.
        # Continue collecting independent compile evidence; mandatory gate below
        # still refuses packaging after any missing/failed runtime test.
        continue-on-error: true
        if: ${{ !cancelled() && matrix.game == 'pikmin1' && steps.coop_socket_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/run_ios_coop_socket_probe.py \
            --app "$RUNNER_TEMP/nectar-coop-socket/NectarCoopSocketProbe.app" \
            --health-app "$RUNNER_TEMP/nectar-coop-socket/NectarCoopHealthProbe.app" \
            --output ios-coop-socket-results
      - name: Configure iPhoneOS ARM64 target without signing
        shell: bash
        run: |
          set -euo pipefail
          # P2 collects independent compiler errors with make -k, instead of
          # ending the entire diagnostic run at the first failed translation unit.
          # P1 retains its verified Xcode generator. Both still target iphoneos ARM64.
          GENERATOR=Xcode
          if [ "$GAME" = pikmin2 ]; then
            GENERATOR="Unix Makefiles"
          fi
          # Keep the command array non-empty: macOS Bash 3.2 with nounset
          # rejects expansion of an empty optional-arguments array.
          CONFIGURE_COMMAND=(cmake -S ios -B "$RUNNER_TEMP/nectar-build" -G "$GENERATOR"
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_SYSTEM_NAME=iOS
            -DCMAKE_OSX_SYSROOT=iphoneos
            -DCMAKE_OSX_ARCHITECTURES=arm64
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
            -DNECTAR_IOS_GAME="$GAME"
            -DNECTAR_IOS_VARIANT="$IOS_VARIANT"
            -DCMAKE_CXX_FLAGS="-ferror-limit=80")
          if [ "$GAME" = pikmin1 ]; then
            PREFIX="$HOME/.cache/open-nectar/netplay-deps/install/ios-arm64"
            CONFIGURE_COMMAND+=(-DNECTAR_COOP_WORLD=ON -DNECTAR_IOS_COOP_TRANSPORT=ON
              "-DCMAKE_PREFIX_PATH=$PREFIX" "-DCMAKE_FIND_ROOT_PATH=$PREFIX")
          fi
          if [ "$GAME" = pikmin2 ] && command -v gmake >/dev/null 2>&1; then
            CONFIGURE_COMMAND+=("-DCMAKE_MAKE_PROGRAM=$(command -v gmake)")
          fi
          "${CONFIGURE_COMMAND[@]}"
          python3 ios/verify_bundle_info.py "$RUNNER_TEMP/nectar-build/Nectar-${GAME}-Info.plist" --game "$GAME" --variant "$IOS_VARIANT"
      - name: Compile native game
        shell: bash
        run: |
          set -o pipefail
          if [ "$GAME" = pikmin1 ]; then TARGET=pikmin_pc; else TARGET=pikmin2_pc; fi
          BUILD_ARGS=()
          if [ "$GAME" = pikmin2 ]; then
            BUILD_ARGS=(-- -k)
            MAKE_TOOL=$(sed -n 's/^CMAKE_MAKE_PROGRAM:[^=]*=//p' "$RUNNER_TEMP/nectar-build/CMakeCache.txt")
            if "$MAKE_TOOL" --help | grep -q 'output-sync'; then
              BUILD_ARGS+=(--output-sync=target)
            fi
          fi
          cmake --build "$RUNNER_TEMP/nectar-build" --config Release \
            --target "$TARGET" --parallel 3 \
            "${BUILD_ARGS[@]}" \
            2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log"
      - name: Preserve compiled app for packaging recovery
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/nectar-build" -type d -name 'Nectar-*.app' | head -n 1)"
          test -n "$APP"
          python3 ios/prepare_bundle_icons.py "$APP" --game "$GAME" --variant "$IOS_VARIANT"
          # Preserve the compiled app even if a later packaging-only check fails.
          tar -czf "$GITHUB_WORKSPACE/nectar-${GAME}-compiled-app.tar.gz" -C "$(dirname "$APP")" "$(basename "$APP")"
          if [ "$GAME" = pikmin1 ]; then
            python3 ios/verify_coop_bundle.py --app "$APP" --variant "$IOS_VARIANT" \
              --licenses "$HOME/.cache/open-nectar/netplay-deps/install/ios-arm64/share/nectar-net/licenses"
          fi
      - name: Index compiler and linker errors
        if: always()
        run: python3 tests/ios_build_error_summary.py ios-build.log ios-build-errors.md
      - name: Require all native room checks before packaging
        if: ${{ !cancelled() && matrix.game == 'pikmin1' }}
        env:
          ROOM_CHECK_OUTCOME: ${{ steps.coop_room_checks.outcome }}
        run: python3 tests/run_ios_room_checks.py --verify ios-room-check-results/result.json --outcome "$ROOM_CHECK_OUTCOME"
      - name: Require complete real iOS socket runtime before packaging
        if: ${{ !cancelled() && matrix.game == 'pikmin1' }}
        env:
          SOCKET_CHECK_OUTCOME: ${{ steps.coop_socket_run.outcome }}
        run: python3 tests/run_ios_coop_socket_probe.py --verify ios-coop-socket-results/result.json --outcome "$SOCKET_CHECK_OUTCOME"
      - name: Require actual practice startup, view and authority checks before packaging
        if: ${{ !cancelled() && matrix.game == 'pikmin1' }}
        env:
          PRACTICE_CHECK_OUTCOME: ${{ steps.coop_practice_checks.outcome }}
        run: python3 tests/run_pikmin1_practice_checks.py --verify ios-practice-check-results/result.json --outcome "$PRACTICE_CHECK_OUTCOME"
      - name: Package unsigned app for later signing (only if compilation succeeds)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/nectar-build" -type d -name 'Nectar-*.app' | head -n 1)"
          test -n "$APP"
          test -f "$APP/Info.plist"
          python3 ios/verify_bundle_info.py "$APP/Info.plist" --game "$GAME" --variant "$IOS_VARIANT" --require-binary
          python3 ios/verify_scene_bundle.py "$APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          lipo "$APP/$EXECUTABLE" -verify_arch arm64
          lipo -info "$APP/$EXECUTABLE"
          mkdir -p "$RUNNER_TEMP/ios-ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ios-ipa/Payload/$(basename "$APP")"
          cd "$RUNNER_TEMP/ios-ipa"
          zip -qr "$GITHUB_WORKSPACE/${EXECUTABLE}-unsigned.ipa" Payload
      - name: Keep build logs and any IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nectar-${{ env.GAME }}-${{ env.IOS_VARIANT != 'standard' && env.IOS_VARIANT || 'experimental' }}
          path: |
            ios-build.log
            ios-build-errors.md
            ios-coop-socket-build.log
            ios-coop-socket-results/
            ios-room-check-results/
            ios-practice-check-results/
            Nectar-*-unsigned.ipa
            nectar-*-compiled-app.tar.gz
          if-no-files-found: warn
